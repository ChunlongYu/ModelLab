[project]
name = "modellab"
version = "0.2.0"
description = "个人数学建模与忠实求解平台"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pillow>=11,<13", "highspy>=1.10,<2", "python-dotenv>=1,<2", "openpyxl>=3.1,<4"]
[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/modellab"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["docker: requires Docker daemon and runner image", "llm: requires real model credentials", "browser: requires built frontend and browser"]
